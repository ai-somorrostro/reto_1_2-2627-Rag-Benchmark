[project]
name = "rag-benchmark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

# Dos entornos separados: docling necesita huggingface-hub<2 y vLLM 0.34 necesita >=2.
#   Fase 1 (convertir_*.py, chunking.py, trocear.py):  uv sync --extra corpus
#   Fases 2 y 3 (benchmark_*.py, run_all_embeddings.py, generar_tablas_llm.py):  uv sync --extra benchmark
[project.optional-dependencies]
corpus = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.150.1",
]
benchmark = [
    "numpy==2.3.5",
    "torch==2.14.0",
    "vllm==0.34.0",
]

[tool.uv]
conflicts = [
    [{ extra = "corpus" }, { extra = "benchmark" }],
]
