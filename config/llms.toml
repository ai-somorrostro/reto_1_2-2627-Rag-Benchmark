[benchmark]
output_dir = "artifacts/llms"
embedding_config = "config/embeddings.toml"
scenarios = ["boe", "debian"]
top_k = 5
temperature = 0.0
max_tokens = 256
max_model_len = 3072
gpu_memory_utilization = 0.95
enforce_eager = true
seed = 42
cost_question_count = 5
cost_repeats = 3

[models.qwen2_5_3b_instruct]
model_id = "Qwen/Qwen2.5-3B-Instruct"
size_category = "small"
checkpoint_dtype = "bfloat16"
quantization = "none"
prompt_format = "chat_template"

[models.llama_3_2_3b_instruct]
model_id = "meta-llama/Llama-3.2-3B-Instruct"
size_category = "small"
checkpoint_dtype = "bfloat16"
quantization = "none"
prompt_format = "chat_template"

[models.qwen2_5_7b_instruct]
model_id = "Qwen/Qwen2.5-7B-Instruct"
size_category = "medium"
checkpoint_dtype = "bfloat16"
quantization = "none"
prompt_format = "chat_template"

[models.granite_4_1_8b_llmon_preview]
model_id = "ibm-granite/granite-4.1-8b-llmon-preview"
size_category = "medium"
